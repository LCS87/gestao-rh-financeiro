version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestao-rh-postgres
    environment:
      POSTGRES_DB: gestao_rh_financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gestao-rh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gestao-rh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gestao-rh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-rh-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gestao_rh_financeiro
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no ambiente ou .env}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?defina JASYPT_ENCRYPTOR_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3007}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gestao-rh-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestao-rh-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gestao-rh-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:


networks:
  gestao-rh-network:
    driver: bridge
