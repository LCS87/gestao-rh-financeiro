spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  flyway:
    enabled: true
    validate-on-migrate: true

logging:
  level:
    root: WARN
    br.com.callcenter: INFO
    org.springframework: WARN

server:
  error:
    include-message: never
    include-stacktrace: never
